<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問路小鎮｜Unit 4 文法互動遊戲</title><style>
:root{--bg:#faf7ef;--ink:#294c45;--green:#386b58;--light:#e8efdf;--gold:#e3ad45;--line:#dce1d4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}header{max-width:1200px;margin:auto;padding:24px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:0}small,.muted{color:#708276}button,select{font:inherit}button{border:1px solid var(--line);border-radius:14px;padding:13px 18px;background:white;color:var(--ink);min-height:50px;cursor:pointer;font-weight:650;touch-action:manipulation}button:hover{background:#f1f5eb;border-color:#7a9b7d}button:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary,button.active{background:var(--green);color:white;border-color:var(--green)}main{max-width:1200px;margin:auto;padding:0 20px 25px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 22px}.tab{flex:1}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(290px,1fr);gap:22px}.panel{border:1px solid var(--line);border-radius:24px;background:#fffef9;padding:22px;box-shadow:0 12px 35px #294c4505}.mapbox{position:relative;overflow:hidden;background:#eef2e5;border-radius:20px}.mapbox svg{display:block;width:100%;height:auto}.avatar{transition:transform .32s ease}.legs{animation:walk .2s alternate 3}@keyframes walk{to{transform:translateY(-3px)}}.pill{display:inline-block;border-radius:20px;background:var(--light);padding:6px 12px;font-size:13px}.title{font-size:30px;margin:16px 0 8px;line-height:1.35}.en{font-family:system-ui,sans-serif;font-weight:750}.question{font-size:23px;line-height:1.6;margin:18px 0}.translation{font-size:15px;color:#798577;line-height:1.7}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.controls button{padding:14px 5px;line-height:1.6}.controls b{display:block;font-size:29px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.feedback{min-height:54px;padding:12px;border-radius:12px;background:#f3f1e7;font-weight:650;line-height:1.7}.instruction{padding:18px;background:#eaf1e2;border-radius:16px;margin:18px 0;font-size:24px;line-height:1.5}.note{font-size:14px;line-height:1.8;color:#6d7c71}.log{max-height:130px;overflow:auto;line-height:1.8;font-size:14px;padding-left:25px}.status{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.sentence{max-width:850px;margin:auto;padding:30px}.slot{min-height:110px;padding:18px;border:2px dashed #c7d2bd;border-radius:16px;display:flex;gap:10px;align-content:center;flex-wrap:wrap;margin:18px 0}.tokens{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:25px 0}.token{font-size:23px}.sentence h2{font-size:30px}.progress{height:8px;border-radius:10px;background:#e8eadd;margin:15px 0}.fill{height:100%;background:var(--green);border-radius:10px}.wide{width:100%}select{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);max-width:100%}.hint{font-size:16px;line-height:1.8;margin:12px 0;min-height:30px}.history{font-size:13px;color:#758577}footer{text-align:center;font-size:13px;padding:20px;color:#788573}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:14px 0}.dot{color:#bf7735}.summary{text-align:center;padding:45px 10px}.summary .big{font-size:72px}@media(max-width:800px){.layout{grid-template-columns:1fr}.tabs{gap:6px}.tab{min-width:42%;font-size:15px}.panel{padding:16px}header{padding:18px}h1{font-size:21px}main{padding:0 12px 20px}.sentence{padding:20px}.title{font-size:25px}.controls button{font-size:15px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><header><div><h1>🌳 問路小鎮 <small>Grammar Town</small></h1><small>Explore Our World 3 · Unit 4</small></div><button id="sound" aria-pressed="true">🔊 聲音開</button></header><main><nav class="tabs" aria-label="遊戲選單"><button class="tab active" data-mode="sentence">① 句子拼拼看</button><button class="tab" data-mode="learn">② 指令練習場</button><button class="tab" data-mode="follow">③ 聽指令帶路</button><button class="tab" data-mode="free">④ 小小導航員</button></nav><div id="app"></div></main><footer>不限時 · 可重試 · 支援觸控 · 左右以小人的面向為準</footer><script>
'use strict';
const $=s=>document.querySelector(s),app=$('#app');let mode='sentence',sound=true,token=0,busy=false,state={x:0,y:4,d:0},route=[],step=0,mission=0,log=[],completed=0,sentenceIndex=0,picks=[],pool=[],answered=false;
const dirs=[[0,-1],[1,0],[0,1],[-1,0]],dirNames=['北 ↑','東 →','南 ↓','西 ←'];
const places=[['hospital','醫院','🏥'],['bakery','麵包店','🥐'],['restaurant','餐廳','🍽️'],['supermarket','超級市場','🛒'],['train station','火車站','🚆'],['toy store','玩具店','🧸'],['museum','博物館','🏺'],['movie theater','電影院','🎬'],['police station','警察局','🚓'],['park','公園','🌳'],['library','圖書館','📚'],['swimming pool','游泳池','🏊'],['mall','購物中心','🛍️'],['zoo','動物園','🦒'],['stadium','體育場','🏟️'],['bookstore','書店','📖']].map(([en,zh,icon],i)=>({en,zh,icon,x:i%4+1,y:Math.floor(i/4)}));
const avenues=['First Avenue','Second Avenue','Third Avenue','Fourth Avenue','Fifth Avenue'];
const commands={go:'Go straight.',left:'Turn left.',right:'Turn right.'};
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function speak(s){if(!sound||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}
function message(s){if($('#feedback'))$('#feedback').textContent=s}
function wait(fn,ms){let n=token;setTimeout(()=>{if(n===token)fn()},ms)}
function transition(s,c){if(c==='left')return {...s,d:(s.d+3)%4};if(c==='right')return {...s,d:(s.d+1)%4};let [dx,dy]=dirs[s.d],x=s.x+dx,y=s.y+dy;return x<0||x>4||y<0||y>4?null:{x,y,d:s.d}}
function plan(s,t){let q=[[s,[]]],seen=new Set();for(let k=0;k<q.length;k++){let [v,r]=q[k],id=[v.x,v.y,v.d].join();if(seen.has(id))continue;seen.add(id);if(v.x===t.x&&v.y===t.y)return r;for(let c of ['go','left','right']){let n=transition(v,c);if(n)q.push([n,[...r,c]])}}return []}
function destination(){return places[mission%places.length]}
function mapSvg(){let out='<svg viewBox="0 0 640 640" role="img" aria-label="城市地圖，小人位置和面向以箭頭顯示；橘色旗子為目的地入口"><rect width="640" height="640" rx="20" fill="#eaf0e1"/>';
for(let j=0;j<5;j++){let p=80+j*120;out+='<path d="M'+p+' 48V595 M48 '+p+'H595" stroke="#d9d8cb" stroke-width="37"/><path d="M'+p+' 48V595 M48 '+p+'H595" stroke="#fffdf4" stroke-dasharray="8 9" stroke-width="2"/>';}
places.forEach(p=>{let x=80+(p.x-1)*120+26,y=80+p.y*120+25;let parts=p.en.split(' ');out+='<rect x="'+x+'" y="'+y+'" width="69" height="70" rx="12" fill="#fffdf5" stroke="#cdd6c2"/><text x="'+(x+34)+'" y="'+(y+31)+'" text-anchor="middle" font-size="27">'+p.icon+'</text>';parts.forEach((s,i)=>out+='<text x="'+(x+34)+'" y="'+(y+48+i*12)+'" text-anchor="middle" font-size="10" fill="#344f46" font-weight="600">'+s+'</text>');});
for(let j=0;j<5;j++)out+='<text x="'+(80+j*120)+'" y="26" text-anchor="middle" font-size="11" fill="#5d7567">'+avenues[j]+'</text>';
if(mode==='free'||mode==='follow'){let t=destination(),x=80+t.x*120,y=80+t.y*120;out+='<circle cx="'+x+'" cy="'+y+'" r="22" fill="#e9b354" opacity=".35"/><path d="M'+x+' '+y+'v-31l25 8-25 8" fill="#bd7933" stroke="#bd7933" stroke-width="3"/><path d="M'+(x-10)+' '+(y+9)+'l-18 18" stroke="#bd7933" stroke-width="2" stroke-dasharray="4 3"/>';}
out+='<g id="person" class="avatar" style="transform:translate('+(80+state.x*120)+'px,'+(80+state.y*120)+'px)"><circle r="23" fill="#fffaf1" stroke="#386b58" stroke-width="2"/><g id="heading" style="transform:rotate('+(state.d*90)+'deg)"><path d="M0 -33l-8 10h16z" fill="#386b58"/></g><g id="body"><circle cy="-8" r="6" fill="#d8a071"/><path d="M-7 9V2q7-8 14 0v7" fill="#386b58"/><path d="M-4 9v7m8-7v7" stroke="#294c45" stroke-width="3"/></g></g></svg>';return out}
function updatePerson(){let e=$('#person');e.style.transform='translate('+(80+state.x*120)+'px,'+(80+state.y*120)+'px)';$('#heading').style.transform='rotate('+(state.d*90)+'deg)';$('#body').classList.remove('legs');void $('#body').getBoundingClientRect();$('#body').classList.add('legs');$('#facing').textContent='面向 '+dirNames[state.d];$('#position').textContent='位於 '+avenues[state.x];}
function controls(){return '<div class="controls"><button data-c="left"><b>↶</b>Turn left<br><small>向左轉</small></button><button data-c="go"><b>↑</b>Go straight<br><small>往前走</small></button><button data-c="right"><b>↷</b>Turn right<br><small>向右轉</small></button></div>'}
function bindControls(){document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>action(b.dataset.c))}
function switchMode(m){token++;busy=false;mode=m;if('speechSynthesis'in window)speechSynthesis.cancel();document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-current',b.dataset.mode===mode?'page':'false')});if(m==='sentence'){sentenceIndex=0;sentence()}else{mission=0;completed=0;setupMission()}}
function setupMission(){token++;busy=false;log=[];step=0;state=mode==='learn'?{x:2,y:2,d:0}:{x:0,y:4,d:mission%4};route=plan(state,destination());renderMap();}
function currentInstruction(){let c=route[step];if(!c)return '';if(c==='go')return 'Go straight.';let turn=c==='left'?'Turn left':'Turn right';let landmark=places.find(p=>p.x===state.x&&p.y===state.y);if(mission%2===1&&landmark)return turn+' at the '+landmark.en+'.';return turn+' on '+avenues[state.x]+'.'}
function renderMap(){let free=mode==='free',learn=mode==='learn',p=destination();app.innerHTML='<div class="layout"><section class="panel"><div class="status"><span class="pill" id="facing">面向 '+dirNames[state.d]+'</span><span class="pill" id="position">位於 '+avenues[state.x]+'</span></div><div class="mapbox">'+mapSvg()+'</div><div class="legend"><span>🟢 小人與面向箭頭</span><span class="dot">⚑ 目的地入口</span></div><p class="note">每按一次 Go straight，前進一個路段。Turn left / right 只轉身；接著按 Go straight 才會走。左右跟著小人的面向改變。</p></section><section class="panel"><span class="pill">'+(learn?'自由練習 · 不計分':(mission+1)+' / 16 個任務')+'</span><h2 class="title">'+(learn?'先認識三個指令':free?'你來幫忙帶路':'聽一聽，帶他走')+'</h2><div class="question">'+(learn?'Try the three commands.':'Can you help?<br><span class="en">How can I get to the '+p.en+'?</span>')+'</div><div class="translation">'+(learn?'先觀察小人的面向，再試試直走、左轉、右轉。':'你能幫忙嗎？我要怎麼到'+p.zh+'？<br>走到'+p.icon+'旁的橘色旗子，就是抵達入口。')+'</div>'+(learn?'':free?'<div class="instruction">Sure. How can I help?<br><small class="translation">請選擇指令，帶小人到目的地。</small></div>':'<div id="instruction" class="instruction">'+currentInstruction()+'</div><button id="repeat" class="wide">🔊 再聽一次指令</button>')+controls()+'<div id="feedback" class="feedback" aria-live="polite">'+(learn?'點選按鈕，看小人怎麼走！':'先看小人的綠色箭頭，再選指令。')+'</div><div id="hint" class="hint" aria-live="polite"></div><div class="actions">'+(learn?'':'<button id="hintbtn">💡 提示下一步</button>')+'<button id="restart">↺ 重新開始</button>'+(learn?'<button id="direction">換個面向</button>':'')+'</div><div id="nextarea"></div><div class="history">走過的路線</div><ol id="log" class="log"></ol></section></div>';bindControls();$('#restart').onclick=setupMission;if(learn)$('#direction').onclick=()=>{if(busy)return;state.d=(state.d+1)%4;updatePerson();message('現在面向'+dirNames[state.d]+'，再試試左轉和右轉。')};else $('#hintbtn').onclick=()=>{$('#hint').textContent='下一步：'+commands[free?plan(state,p)[0]:route[step]]};if(mode==='follow'){$('#repeat').onclick=()=>speak(currentInstruction());speak(currentInstruction())}}
function action(c){if(busy)return;let learn=mode==='learn';if(mode==='follow'&&c!==route[step]){message('再聽一次：'+currentInstruction()+' 左右以小人的面向為準。');speak(currentInstruction());return}let n=transition(state,c);if(!n){message('前面是地圖邊界，請先轉向再走。');return}busy=true;let phrase=mode==='follow'?currentInstruction():commands[c];state=n;log.push(phrase);$('#log').innerHTML=log.map(s=>'<li>'+s+'</li>').join('');$('#log').scrollTop=$('#log').scrollHeight;updatePerson();speak(phrase);$('#hint').textContent='';message(c==='go'?'往前走了一個路段！':'轉好了！現在面向'+dirNames[state.d]+'。');if(mode==='follow'){step++;$('#instruction').textContent=currentInstruction()||'You are here!'}wait(()=>{busy=false;if(!learn&&state.x===destination().x&&state.y===destination().y)arrive();else if(mode==='follow')speak(currentInstruction())},420)}
function arrive(){busy=true;completed++;let p=destination();message('🎉 抵達 '+p.zh+'！ You are at the '+p.en+'.');speak('You are at the '+p.en+'. Thank you!');$('#hintbtn').disabled=true;if($('#repeat'))$('#repeat').disabled=true;$('#nextarea').innerHTML='<button id="nextmission" class="primary wide">'+(mission===15?'看我的成果 ✨':'下一個任務 →')+'</button>';$('#nextmission').onclick=()=>{if(mission===15){app.innerHTML='<section class="panel summary"><div class="big">🏆</div><h2>完成 16 個帶路任務！</h2><p>你會問路，也會用英文帶路了。</p><button id="replay" class="primary">再走一次</button></section>';$('#replay').onclick=()=>switchMode(mode)}else{mission++;setupMission()}}}
const sentences=[
{zh:'你能幫忙嗎？',parts:['Can','you','help?'],hint:'Can 放句首，問號放最後。'},
{zh:'當然可以。我可以怎麼幫你？',parts:['Sure.','How','can','I','help?'],hint:'先答 Sure.，再用 How can I… 問句。'},
{zh:'我要怎麼到圖書館？',parts:['How','can','I','get to','the library?'],hint:'How can I get to the + 地點？'},
{zh:'我要怎麼到博物館？',parts:['How','can','I','get to','the museum?'],hint:'get to 表示到達。'},
{zh:'我要怎麼到火車站？',parts:['How','can','I','get to','the train station?'],hint:'地點前面使用 the。'},
{zh:'直走。',parts:['Go','straight.'],hint:'Go straight. 是直走。'},
{zh:'在第三大道左轉。',parts:['Turn','left','on','Third Avenue.'],hint:'本單元用 on 接道路名稱。'},
{zh:'在超級市場右轉。',parts:['Turn','right','at','the supermarket.'],hint:'at 接轉彎的地標。'},
{zh:'在警察局左轉。',parts:['Turn','left','at','the police station.'],hint:'Turn left at the + 地標。'},
{zh:'在第二大道右轉。',parts:['Turn','right','on','Second Avenue.'],hint:'Turn right on + 道路名稱。'},
{zh:'我要怎麼到游泳池？',parts:['How','can','I','get to','the swimming pool?'],hint:'How → can → I → get to → 地點。'},
{zh:'先直走，再在麵包店左轉。',parts:['Go straight.','Turn','left','at','the bakery.'],hint:'兩句依序排列，地標前面用 at。'}];
function sentence(){answered=false;picks=[];pool=shuffle(sentences[sentenceIndex].parts.map((text,id)=>({text,id})));let q=sentences[sentenceIndex];app.innerHTML='<section class="panel sentence"><span class="pill">句子拼拼看 · '+(sentenceIndex+1)+' / '+sentences.length+'</span><div class="progress"><div class="fill" style="width:'+(sentenceIndex/sentences.length*100)+'%"></div></div><h2>把英文排成一句話</h2><p class="question">'+q.zh+'</p><p class="note">依序點選字卡。點上方已選字卡，可以把它放回。</p><div id="slots" class="slot" aria-label="你的句子"></div><div id="tokens" class="tokens"></div><div class="actions"><button id="check" class="primary">✓ 檢查句子</button><button id="clear">重新排</button><button id="sentencehint">💡 提示</button><button id="listen">🔊 聽句子</button></div><div id="feedback" class="feedback" aria-live="polite">慢慢排，可以重試。</div><div id="hint" class="hint" aria-live="polite"></div><div id="nextarea"></div></section>';renderTokens();$('#clear').onclick=()=>{if(!answered){picks=[];renderTokens()}};$('#sentencehint').onclick=()=>{$('#hint').textContent=q.hint};$('#listen').onclick=()=>speak(q.parts.join(' '));$('#check').onclick=()=>{if(answered)return;if(picks.length!==pool.length){message('還有字卡沒排好喔！');return}let correct=picks.map(i=>pool[i].text).join(' ')===q.parts.join(' ');if(!correct){message('再看一下順序，點上方字卡就能修改。');return}answered=true;message('✅ 答對了！ '+q.parts.join(' '));speak(q.parts.join(' '));$('#nextarea').innerHTML='<button id="nextsentence" class="primary wide">'+(sentenceIndex===sentences.length-1?'完成句子練習 →':'下一題 →')+'</button>';$('#nextsentence').onclick=()=>{if(sentenceIndex===sentences.length-1){switchMode('learn')}else{sentenceIndex++;sentence()}}}}
function renderTokens(){$('#slots').innerHTML=picks.map((i,j)=>'<button class="token" data-remove="'+j+'">'+pool[i].text+'</button>').join('');$('#tokens').innerHTML=pool.map((p,i)=>'<button class="token" data-pick="'+i+'" '+(picks.includes(i)?'disabled':'')+'>'+p.text+'</button>').join('');document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(!answered){picks.push(+b.dataset.pick);renderTokens()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!answered){picks.splice(+b.dataset.remove,1);renderTokens()}})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));$('#sound').onclick=()=>{sound=!sound;$('#sound').textContent=sound?'🔊 聲音開':'🔇 聲音關';$('#sound').setAttribute('aria-pressed',String(sound));if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};switchMode('sentence');
</script></body></html>
